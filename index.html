<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-50:  #eff6ff;
      --blue-100: #dbeafe;
      --blue-200: #bfdbfe;
      --blue-400: #60a5fa;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --blue-800: #1e40af;
      --gray-50:  #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --card-bg:  #ffffff;
      --modal-bg: #ffffff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
      --shadow:    0 2px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.08);
      --radius: 12px;
    }

    /* ── Dark mode overrides ── */
    [data-theme="dark"] {
      --blue-50:  #0f172a;
      --blue-100: #1e3a5f;
      --blue-200: #1e40af;
      --gray-50:  #1e293b;
      --gray-100: #1e293b;
      --gray-200: #334155;
      --gray-400: #64748b;
      --gray-500: #94a3b8;
      --gray-700: #cbd5e1;
      --gray-900: #f1f5f9;
      --card-bg:  #1e293b;
      --modal-bg: #1e293b;
      --shadow:    0 2px 8px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.2);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.4), 0 4px 10px rgba(0,0,0,.3);
    }

    [data-theme="dark"] body { background: #0f172a; }

    [data-theme="dark"] .pill { background: #1e293b; border-color: #334155; }
    [data-theme="dark"] .pill:hover { background: #1e3a5f; }

    [data-theme="dark"] .form-group input:focus,
    [data-theme="dark"] .form-group textarea:focus { background: #0f172a; }

    [data-theme="dark"] .btn-cancel { background: #1e293b; border-color: #334155; }
    [data-theme="dark"] .btn-cancel:hover { background: #0f172a; }

    [data-theme="dark"] .card-notes { border-top-color: #334155; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--blue-50);
      color: var(--gray-900);
      min-height: 100vh;
      transition: background .3s, color .3s;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--blue-700) 0%, var(--blue-600) 100%);
      color: #fff;
      padding: 28px 24px 32px;
      position: relative;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .header-title {
      flex: 1;
      min-width: 180px;
    }

    .header-title h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -.5px;
    }

    .header-title p {
      font-size: .875rem;
      opacity: .8;
      margin-top: 2px;
    }

    .search-wrap {
      flex: 1;
      min-width: 220px;
      max-width: 400px;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--blue-400);
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,.18);
      color: #fff;
      font-size: .9rem;
      font-family: inherit;
      outline: none;
      transition: background .2s;
    }

    #search::placeholder { color: rgba(255,255,255,.65); }
    #search:focus { background: rgba(255,255,255,.28); }

    /* ── Dark mode toggle ── */
    .btn-theme {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.15);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }

    .btn-theme:hover { background: rgba(255,255,255,.28); border-color: rgba(255,255,255,.6); }

    .btn-theme svg { width: 18px; height: 18px; }

    .icon-sun  { display: none; }
    .icon-moon { display: block; }
    [data-theme="dark"] .icon-sun  { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }

    /* ── Toolbar ── */
    .toolbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-add {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--blue-600);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: .875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, transform .1s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-add:hover  { background: var(--blue-700); }
    .btn-add:active { transform: scale(.97); }

    .pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 500;
      border: 1.5px solid var(--blue-200);
      background: var(--card-bg);
      color: var(--blue-600);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .pill:hover { background: var(--blue-100); }

    .pill.active {
      background: var(--blue-600);
      border-color: var(--blue-600);
      color: #fff;
    }

    /* ── Grid ── */
    .grid-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 24px 48px;
    }

    #count {
      font-size: .8rem;
      color: var(--gray-500);
      margin-bottom: 16px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow .2s, transform .2s, background .3s;
      position: relative;
      border: 1px solid var(--gray-200);
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cat-badge {
      font-size: .72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--blue-100);
      color: var(--blue-700);
      text-transform: uppercase;
      letter-spacing: .04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    .card-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-edit,
    .btn-delete {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
    }

    .btn-edit {
      color: var(--gray-400);
    }

    .btn-edit:hover { background: var(--blue-100); color: var(--blue-600); }

    .btn-edit svg { width: 14px; height: 14px; }

    .btn-delete {
      color: var(--gray-400);
      font-size: 1.1rem;
      line-height: 1;
    }

    .btn-delete:hover { background: #fee2e2; color: #dc2626; }

    .card-title a {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray-900);
      text-decoration: none;
      line-height: 1.3;
      display: block;
    }

    .card-title a:hover { color: var(--blue-600); }

    .card-url {
      font-size: .78rem;
      color: var(--blue-500);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-notes {
      font-size: .82rem;
      color: var(--gray-500);
      font-style: italic;
      line-height: 1.5;
      border-top: 1px solid var(--gray-100);
      padding-top: 8px;
    }

    .card-date {
      font-size: .72rem;
      color: var(--gray-400);
      margin-top: auto;
    }

    /* ── Empty state ── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-400);
    }

    .empty svg { margin-bottom: 16px; opacity: .5; }
    .empty p { font-size: 1rem; }

    /* ── Modal ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.5);
      backdrop-filter: blur(3px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--modal-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      padding: 28px;
      animation: slideUp .2s ease;
      border: 1px solid var(--gray-200);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .modal h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--gray-900);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 5px;
    }

    .form-group label span { color: var(--gray-400); font-weight: 400; }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      font-size: .875rem;
      font-family: inherit;
      color: var(--gray-900);
      outline: none;
      transition: border-color .15s, background .15s;
      background: var(--gray-50);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--blue-400);
      background: var(--card-bg);
    }

    .form-group textarea { resize: vertical; min-height: 80px; }

    .form-error {
      font-size: .75rem;
      color: #dc2626;
      margin-top: 4px;
      display: none;
    }

    .form-error.show { display: block; }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .btn-cancel {
      padding: 9px 18px;
      border-radius: 8px;
      border: 1.5px solid var(--gray-200);
      background: var(--card-bg);
      color: var(--gray-700);
      font-size: .875rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-cancel:hover { background: var(--gray-100); }

    .btn-save {
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      background: var(--blue-600);
      color: #fff;
      font-size: .875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-save:hover { background: var(--blue-700); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .header-inner { flex-direction: column; align-items: stretch; }
      .search-wrap  { max-width: 100%; }
      .header-title h1 { font-size: 1.4rem; }
      #grid { grid-template-columns: 1fr; }
      .toolbar { gap: 10px; }
    }

    @media (max-width: 480px) {
      header { padding: 20px 16px 24px; }
      .toolbar, .grid-section { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">
      <h1>My Bookmarks</h1>
      <p>Your personal link dashboard</p>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" d="M9 3a6 6 0 100 12A6 6 0 009 3zM1 9a8 8 0 1114.32 4.906l3.387 3.387a1 1 0 01-1.414 1.414l-3.387-3.387A8 8 0 011 9z" clip-rule="evenodd"/>
      </svg>
      <input type="search" id="search" placeholder="Search bookmarks..." autocomplete="off" />
    </div>
    <button class="btn-theme" id="btnTheme" title="Toggle dark mode" aria-label="Toggle dark mode">
      <!-- Sun (shown in dark mode) -->
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- Moon (shown in light mode) -->
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<div class="toolbar">
  <button class="btn-add" id="btnAdd">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/>
    </svg>
    Add Bookmark
  </button>
  <div class="pills" id="pills"></div>
</div>

<div class="grid-section">
  <div id="count"></div>
  <div id="grid"></div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Add Bookmark</h2>
    <form id="bookmarkForm" novalidate>
      <div class="form-group">
        <label for="fTitle">Title</label>
        <input type="text" id="fTitle" placeholder="e.g. My Favourite Site" maxlength="120" />
        <div class="form-error" id="errTitle">Please enter a title.</div>
      </div>
      <div class="form-group">
        <label for="fUrl">URL</label>
        <input type="url" id="fUrl" placeholder="https://example.com" />
        <div class="form-error" id="errUrl">Please enter a valid URL (include https://).</div>
      </div>
      <div class="form-group">
        <label for="fCategory">Category</label>
        <input type="text" id="fCategory" placeholder="e.g. Design" list="catList" maxlength="40" />
        <datalist id="catList"></datalist>
        <div class="form-error" id="errCat">Please enter a category.</div>
      </div>
      <div class="form-group">
        <label for="fNotes">Notes <span>(optional)</span></label>
        <textarea id="fNotes" placeholder="Any notes about this link…" maxlength="300"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btnCancel">Cancel</button>
        <button type="submit" class="btn-save" id="btnSave">Save Bookmark</button>
      </div>
    </form>
  </div>
</div>

<script>
  const STORAGE_KEY = 'bm_data_v1';
  const THEME_KEY   = 'bm_theme';

  const SAMPLE_BOOKMARKS = [
    { id: uid(), title: 'GitHub', url: 'https://github.com', category: 'Dev Tools', notes: 'Code hosting, CI/CD, and collaboration.', createdAt: ts(-10) },
    { id: uid(), title: 'MDN Web Docs', url: 'https://developer.mozilla.org', category: 'Dev Tools', notes: 'The go-to reference for HTML, CSS, and JS.', createdAt: ts(-9) },
    { id: uid(), title: 'Can I Use', url: 'https://caniuse.com', category: 'Dev Tools', notes: 'Browser compatibility tables for web features.', createdAt: ts(-8) },
    { id: uid(), title: 'Stack Overflow', url: 'https://stackoverflow.com', category: 'Dev Tools', notes: '', createdAt: ts(-7) },
    { id: uid(), title: 'Dribbble', url: 'https://dribbble.com', category: 'Design', notes: 'Design inspiration and portfolio showcases.', createdAt: ts(-6) },
    { id: uid(), title: 'Coolors', url: 'https://coolors.co', category: 'Design', notes: 'Fast colour palette generator.', createdAt: ts(-5) },
    { id: uid(), title: 'Google Fonts', url: 'https://fonts.google.com', category: 'Design', notes: 'Free web fonts for any project.', createdAt: ts(-4) },
    { id: uid(), title: 'Notion', url: 'https://notion.so', category: 'Productivity', notes: 'All-in-one workspace for notes and projects.', createdAt: ts(-3) },
    { id: uid(), title: 'Todoist', url: 'https://todoist.com', category: 'Productivity', notes: 'Task manager with natural language input.', createdAt: ts(-2) },
    { id: uid(), title: 'Hacker News', url: 'https://news.ycombinator.com', category: 'News', notes: 'Tech news and startup discussions.', createdAt: ts(-1) },
  ];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function ts(offsetDays) { return new Date(Date.now() + offsetDays * 86400000).toISOString(); }
  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── State ──────────────────────────────────────────
  let state = { bookmarks: [] };
  let activeCategory = 'All';
  let searchQuery = '';
  let editingId = null;

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { state = JSON.parse(raw); return; }
    } catch(e) {}
    state = { bookmarks: SAMPLE_BOOKMARKS.map(b => ({ ...b, id: uid() })) };
    saveData();
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // ── Category colours (deterministic) ───────────────
  const PALETTE = [
    ['#dbeafe','#1d4ed8'], ['#dcfce7','#15803d'], ['#fef9c3','#a16207'],
    ['#fce7f3','#be185d'], ['#ede9fe','#6d28d9'], ['#ffedd5','#c2410c'],
    ['#e0f2fe','#0369a1'], ['#d1fae5','#065f46'],
  ];
  const catColorMap = {};
  let catColorIdx = 0;
  function catColor(cat) {
    const k = cat.toLowerCase();
    if (!catColorMap[k]) { catColorMap[k] = PALETTE[catColorIdx++ % PALETTE.length]; }
    return catColorMap[k];
  }

  // ── Render ─────────────────────────────────────────
  function getFilteredBookmarks() {
    const q = searchQuery.toLowerCase();
    return state.bookmarks.filter(b => {
      const matchSearch = !q || b.title.toLowerCase().includes(q) || b.category.toLowerCase().includes(q);
      const matchCat = activeCategory === 'All' || b.category.toLowerCase() === activeCategory.toLowerCase();
      return matchSearch && matchCat;
    });
  }

  function renderPills() {
    const cats = ['All', ...new Set(state.bookmarks.map(b => b.category))];
    const pillsEl = document.getElementById('pills');
    pillsEl.innerHTML = cats.map(c => {
      const active = c === activeCategory ? ' active' : '';
      return `<button class="pill${active}" data-cat="${escHtml(c)}">${escHtml(c)}</button>`;
    }).join('');
    pillsEl.querySelectorAll('.pill').forEach(p => {
      p.addEventListener('click', () => {
        activeCategory = p.dataset.cat;
        renderPills();
        renderCards();
      });
    });

    // Rebuild datalist
    const dl = document.getElementById('catList');
    dl.innerHTML = cats.filter(c => c !== 'All').map(c => `<option value="${escHtml(c)}">`).join('');
  }

  const EDIT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
  </svg>`;

  function renderCards() {
    const filtered = getFilteredBookmarks();
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');

    count.textContent = filtered.length === 0
      ? ''
      : `${filtered.length} bookmark${filtered.length !== 1 ? 's' : ''}`;

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
          </svg>
          <p>No bookmarks found.</p>
        </div>`;
      return;
    }

    grid.innerHTML = filtered.map(b => {
      const [bg, fg] = catColor(b.category);
      const notesHtml = b.notes
        ? `<div class="card-notes">${escHtml(b.notes)}</div>`
        : '';
      let displayUrl = b.url;
      try { displayUrl = new URL(b.url).hostname.replace(/^www\./, ''); } catch(e) {}
      return `
        <div class="card" data-id="${b.id}">
          <div class="card-top">
            <span class="cat-badge" style="background:${bg};color:${fg}">${escHtml(b.category)}</span>
            <div class="card-actions">
              <button class="btn-edit" data-id="${b.id}" title="Edit bookmark" aria-label="Edit ${escHtml(b.title)}">${EDIT_ICON}</button>
              <button class="btn-delete" data-id="${b.id}" title="Delete bookmark" aria-label="Delete ${escHtml(b.title)}">&#x2715;</button>
            </div>
          </div>
          <div class="card-title"><a href="${escHtml(b.url)}" target="_blank" rel="noopener noreferrer">${escHtml(b.title)}</a></div>
          <div class="card-url">${escHtml(displayUrl)}</div>
          ${notesHtml}
          <div class="card-date">${fmtDate(b.createdAt)}</div>
        </div>`;
    }).join('');

    grid.querySelectorAll('.btn-edit').forEach(btn => {
      btn.addEventListener('click', () => openModal(btn.dataset.id));
    });
    grid.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', () => deleteBookmark(btn.dataset.id));
    });
  }

  function render() { renderPills(); renderCards(); }

  // ── CRUD ───────────────────────────────────────────
  function addBookmark(data) {
    state.bookmarks.unshift({ id: uid(), ...data, createdAt: new Date().toISOString() });
    saveData();
    render();
  }

  function updateBookmark(id, data) {
    const idx = state.bookmarks.findIndex(b => b.id === id);
    if (idx === -1) return;
    state.bookmarks[idx] = { ...state.bookmarks[idx], ...data };
    const cats = new Set(state.bookmarks.map(b => b.category));
    if (activeCategory !== 'All' && !cats.has(activeCategory)) activeCategory = 'All';
    saveData();
    render();
  }

  function deleteBookmark(id) {
    state.bookmarks = state.bookmarks.filter(b => b.id !== id);
    const cats = new Set(state.bookmarks.map(b => b.category));
    if (activeCategory !== 'All' && !cats.has(activeCategory)) activeCategory = 'All';
    saveData();
    render();
  }

  // ── Modal ──────────────────────────────────────────
  const backdrop = document.getElementById('modalBackdrop');
  const form     = document.getElementById('bookmarkForm');

  function openModal(id) {
    editingId = id || null;
    document.getElementById('modalTitle').textContent = editingId ? 'Edit Bookmark' : 'Add Bookmark';
    document.getElementById('btnSave').textContent    = editingId ? 'Save Changes' : 'Save Bookmark';

    if (editingId) {
      const b = state.bookmarks.find(b => b.id === editingId);
      if (b) {
        document.getElementById('fTitle').value    = b.title;
        document.getElementById('fUrl').value      = b.url;
        document.getElementById('fCategory').value = b.category;
        document.getElementById('fNotes').value    = b.notes || '';
      }
    }

    backdrop.classList.add('open');
    document.getElementById('fTitle').focus();
  }

  function closeModal() {
    backdrop.classList.remove('open');
    editingId = null;
    form.reset();
    ['errTitle','errUrl','errCat'].forEach(id => document.getElementById(id).classList.remove('show'));
  }

  document.getElementById('btnAdd').addEventListener('click', () => openModal());
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function isValidUrl(str) {
    try { const u = new URL(str); return u.protocol === 'http:' || u.protocol === 'https:'; }
    catch(e) { return false; }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const title    = document.getElementById('fTitle').value.trim();
    const url      = document.getElementById('fUrl').value.trim();
    const category = document.getElementById('fCategory').value.trim();
    const notes    = document.getElementById('fNotes').value.trim();
    let valid = true;

    document.getElementById('errTitle').classList.toggle('show', !title);
    if (!title) valid = false;

    const badUrl = !isValidUrl(url);
    document.getElementById('errUrl').classList.toggle('show', badUrl);
    if (badUrl) valid = false;

    document.getElementById('errCat').classList.toggle('show', !category);
    if (!category) valid = false;

    if (!valid) return;

    if (editingId) {
      updateBookmark(editingId, { title, url, category, notes });
    } else {
      addBookmark({ title, url, category, notes });
    }
    closeModal();
  });

  // ── Search ─────────────────────────────────────────
  let searchTimer;
  document.getElementById('search').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      renderCards();
    }, 150);
  });

  // ── Dark mode ──────────────────────────────────────
  function applyTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light');
  }

  document.getElementById('btnTheme').addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    applyTheme(!isDark);
  });

  // ── Boot ───────────────────────────────────────────
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme === 'dark') {
    applyTheme(true);
  } else if (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    applyTheme(true);
  }

  loadData();
  render();
</script>
</body>
</html>
